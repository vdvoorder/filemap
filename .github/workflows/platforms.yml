name: platforms

on:
  workflow_dispatch:
  pull_request:
    paths: ['hooks/**', 'tests/**', 'types/**', '.claude-plugin/**', '.github/git-commands.mjs', '.github/workflows/platforms.yml']
  push:
    branches: [main]
    paths: ['hooks/**', 'tests/**', 'types/**', '.claude-plugin/**', '.github/git-commands.mjs', '.github/workflows/platforms.yml']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install Claude Code 2.1.296
        run: npm install -g @anthropic-ai/claude-code@2.1.296 && claude --version
      - name: Validate the plugin and marketplace
        run: claude plugin validate .claude-plugin/plugin.json && claude plugin validate .claude-plugin/marketplace.json
      - name: Plugin tests on this OS
        run: claude plugin test .
      - name: Git commands the mod runs, on a temporary repository
        run: node .github/git-commands.mjs
